services:
  db:
    image: postgres:16
    container_name: freshscan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshscan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshscan_password}
      POSTGRES_DB: ${POSTGRES_DB:-freshscan_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshscan_user} -d ${POSTGRES_DB:-freshscan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freshscan_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshscan_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-freshscan_user}:${POSTGRES_PASSWORD:-freshscan_password}@db:5432/${POSTGRES_DB:-freshscan_db}
      APP_ENV: production
      APP_PORT: 8000
      MODEL_PATH: /app/best_model/best.pt
    volumes:
      - ./best_model:/app/best_model:ro
      - backend_uploads:/app/static/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - freshscan_net

volumes:
  postgres_data:
    name: freshscan_postgres_data
  backend_uploads:
    name: freshscan_backend_uploads

networks:
  freshscan_net:
    name: freshscan_network
    driver: bridge
